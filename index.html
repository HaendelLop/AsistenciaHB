<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Asistencia QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (xlsx) library for Excel export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 flex items-center justify-center min-h-screen">

    <div class="container mx-auto p-4 max-w-2xl">

        <!-- Main Card -->
        <div id="app-card" class="bg-white rounded-2xl shadow-lg transition-all duration-500">
            <!-- Header -->
            <div class="bg-indigo-600 text-white p-6 rounded-t-2xl">
                <h1 id="header-title" class="text-3xl font-bold text-center">Registro de Asistencia</h1>
                <p id="header-subtitle" class="text-center text-indigo-200 mt-1">Ingresa tu nombre para registrar tu asistencia.</p>
            </div>

            <!-- Student View -->
            <div id="student-view" class="p-8">
                <form id="attendance-form" class="space-y-6">
                    <div>
                        <label for="student-name" class="block text-sm font-medium text-gray-700 mb-2">Nombre Completo</label>
                        <input type="text" id="student-name" name="student-name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition" placeholder="Ej. Juan Pérez">
                    </div>
                    <button type="submit" id="submit-button" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-transform transform hover:scale-105 disabled:bg-gray-400 disabled:cursor-not-allowed disabled:transform-none flex items-center justify-center">
                        <svg id="submit-spinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span id="submit-button-text">Registrar Asistencia</span>
                    </button>
                </form>
                <div id="status-message" class="mt-6 text-center p-4 rounded-lg text-sm font-medium hidden"></div>
            </div>

            <!-- Admin View -->
            <div id="admin-view" class="p-8 hidden">
                <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                    <div>
                        <label for="month-select" class="text-sm font-medium text-gray-700">Mes:</label>
                        <select id="month-select" class="ml-2 rounded-lg border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"></select>
                    </div>
                    <button id="export-button" class="bg-green-600 w-full sm:w-auto text-white font-bold py-2 px-5 rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-transform transform hover:scale-105">
                        Exportar a Excel
                    </button>
                </div>

                <div class="overflow-x-auto bg-white rounded-lg shadow">
                   <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha y Hora</th>
                            </tr>
                        </thead>
                        <tbody id="attendance-table-body" class="bg-white divide-y divide-gray-200">
                            <!-- Rows will be inserted here -->
                            <tr id="no-records-row"><td colspan="2" class="px-6 py-12 text-center text-gray-500">No hay registros para el mes seleccionado.</td></tr>
                        </tbody>
                    </table>
                </div>
                 <p class="text-xs text-center text-gray-400 mt-4">Mostrando los registros del mes seleccionado.</p>
            </div>
             <!-- Footer / View Toggle -->
            <div class="bg-gray-100 p-4 rounded-b-2xl text-center">
                 <button id="toggle-view-button" class="text-sm font-medium text-indigo-600 hover:text-indigo-800">
                    Ver Panel de Administrador
                 </button>
            </div>

        </div>
    </div>

    <!-- Password Modal -->
    <div id="password-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-sm">
            <h2 class="text-2xl font-bold text-center mb-4">Acceso de Administrador</h2>
            <p class="text-center text-gray-600 mb-6">Ingresa la clave para continuar.</p>
            <form id="password-form">
                <input type="password" id="password-input" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition" placeholder="Clave de acceso">
                <p id="password-error" class="text-red-500 text-sm mt-2 hidden">Clave incorrecta. Inténtalo de nuevo.</p>
                <div class="flex gap-4 mt-6">
                     <button type="button" id="cancel-password" class="w-full bg-gray-200 text-gray-800 font-bold py-3 px-4 rounded-lg hover:bg-gray-300 transition">Cancelar</button>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 transition">Ingresar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-analytics.js";
        import { getFirestore, collection, addDoc, query, getDocs, Timestamp, where } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

        // --- CONFIGURACIÓN ---
        const ADMIN_PASSWORD = 'proyectouno'; // Cambia esta clave por una más segura
        
        // ***** PASO IMPORTANTE: ACTUALIZA ESTAS COORDENADAS *****
        const TARGET_LATITUDE = 21.04789330834951; // Reemplazar con la latitud de tu ubicación exacta
        const TARGET_LONGITUDE = -89.6169; // Reemplazar con la longitud de tu ubicación exacta
        // *********************************************************

        const MAX_DISTANCE_METERS = 500; // 500 metros de radio
        
        // --- INICIALIZACIÓN DE FIREBASE ---
        // Tu configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCtbmtKObOS-MZw2Mvk52aBVYB5E1kY5IE",
            authDomain: "listajaguarcitas.firebaseapp.com",
            projectId: "listajaguarcitas",
            storageBucket: "listajaguarcitas.appspot.com",
            messagingSenderId: "312429509759",
            appId: "1:312429509759:web:daf948b628c135c2bdd34a",
            measurementId: "G-89359V90VS"
        };
        
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;

        // --- Elementos del DOM ---
        const studentView = document.getElementById('student-view');
        const adminView = document.getElementById('admin-view');
        const toggleViewButton = document.getElementById('toggle-view-button');
        const form = document.getElementById('attendance-form');
        const studentNameInput = document.getElementById('student-name');
        const submitButton = document.getElementById('submit-button');
        const statusMessage = document.getElementById('status-message');
        const headerTitle = document.getElementById('header-title');
        const headerSubtitle = document.getElementById('header-subtitle');
        const submitSpinner = document.getElementById('submit-spinner');
        const submitButtonText = document.getElementById('submit-button-text');
        const attendanceTableBody = document.getElementById('attendance-table-body');
        const exportButton = document.getElementById('export-button');
        const monthSelect = document.getElementById('month-select');
        const noRecordsRow = document.getElementById('no-records-row');
        const passwordModal = document.getElementById('password-modal');
        const passwordForm = document.getElementById('password-form');
        const passwordInput = document.getElementById('password-input');
        const cancelPasswordButton = document.getElementById('cancel-password');
        const passwordError = document.getElementById('password-error');


        // --- LÓGICA DE LA APLICACIÓN ---

        async function initializeAuth() {
            try {
                const userCredential = await signInAnonymously(auth);
                currentUser = userCredential.user;
                console.log("Authentication successful:", currentUser.uid);
                checkIfAlreadyRegistered();
            } catch (error) {
                console.error("Authentication failed:", error);
                showMessage('Error de autenticación. Revisa la configuración de Firebase y los dominios autorizados.', 'error');
                submitButton.disabled = true;
                toggleViewButton.disabled = true;
            }
        }
        
        initializeAuth();

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function showMessage(message, type = 'success') {
            statusMessage.textContent = message;
            statusMessage.className = `mt-6 text-center p-4 rounded-lg text-sm font-medium ${type === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`;
            statusMessage.classList.remove('hidden');
        }
        
        function setButtonLoading(isLoading) {
            submitButton.disabled = isLoading;
            if (isLoading) {
                submitSpinner.classList.remove('hidden');
                submitButtonText.textContent = 'Verificando...';
            } else {
                submitSpinner.classList.add('hidden');
                submitButtonText.textContent = 'Registrar Asistencia';
            }
        }

        function disableForm() {
            studentNameInput.disabled = true;
            submitButton.disabled = true;
            submitButtonText.textContent = 'Asistencia Registrada';
        }

        function checkIfAlreadyRegistered() {
            const today = new Date().toISOString().split('T')[0];
            const registrationKey = `attendance_${today}`;
            if (localStorage.getItem(registrationKey)) {
                showMessage('Ya has registrado tu asistencia por hoy en este dispositivo.', 'success');
                disableForm();
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = studentNameInput.value.trim();
            if (!name) {
                showMessage('Por favor, ingresa tu nombre.', 'error');
                return;
            }
            setButtonLoading(true);
            statusMessage.classList.add('hidden');
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const { latitude, longitude } = position.coords;
                    const distance = getDistance(latitude, longitude, TARGET_LATITUDE, TARGET_LONGITUDE);
                    if (distance <= MAX_DISTANCE_METERS) {
                        try {
                            const attendanceCollection = collection(db, 'attendance');
                            await addDoc(attendanceCollection, { name: name, timestamp: Timestamp.now(), location: { lat: latitude, lon: longitude } });
                            const today = new Date().toISOString().split('T')[0];
                            localStorage.setItem(`attendance_${today}`, 'true');
                            showMessage('¡Asistencia registrada con éxito!', 'success');
                            disableForm();
                        } catch (error) {
                            console.error("Error al guardar en Firestore: ", error);
                            showMessage('No se pudo registrar la asistencia. Inténtalo de nuevo.', 'error');
                        }
                    } else {
                        // ¡CAMBIO IMPORTANTE! Ahora el error te muestra la ubicación detectada.
                        showMessage(`Estás fuera del rango permitido. Distancia: ${Math.round(distance)}m. (Tu ubicación detectada: ${latitude.toFixed(6)}, ${longitude.toFixed(6)})`, 'error');
                    }
                    setButtonLoading(false);
                },
                (error) => {
                    let errorMessage = 'No se pudo obtener tu ubicación. ';
                    switch(error.code) {
                        case error.PERMISSION_DENIED: errorMessage += "Por favor, permite el acceso a la ubicación en tu navegador."; break;
                        case error.POSITION_UNAVAILABLE: errorMessage += "La información de ubicación no está disponible."; break;
                        case error.TIMEOUT: errorMessage += "La solicitud de ubicación ha caducado."; break;
                        default: errorMessage += "Ocurrió un error desconocido."; break;
                    }
                    showMessage(errorMessage, 'error');
                    setButtonLoading(false);
                },
                { enableHighAccuracy: true }
            );
        });

        // --- LÓGICA DEL PANEL DE ADMINISTRADOR ---
        
        function populateMonthSelector() {
            const months = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            const currentYear = new Date().getFullYear();
            const currentMonth = new Date().getMonth();
            monthSelect.innerHTML = '';
            months.forEach((month, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${month} ${currentYear}`;
                monthSelect.appendChild(option);
            });
             monthSelect.value = currentMonth;
        }

        async function fetchAndDisplayAttendance(month) {
            attendanceTableBody.innerHTML = '';
            noRecordsRow.classList.add('hidden');
            const year = new Date().getFullYear();
            const startDate = new Date(year, month, 1);
            const endDate = new Date(year, month + 1, 1);
            try {
                const attendanceCollection = collection(db, 'attendance');
                const q = query(attendanceCollection, where("timestamp", ">=", startDate), where("timestamp", "<", endDate));
                const querySnapshot = await getDocs(q);
                const records = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    records.push({ name: data.name, timestamp: data.timestamp.toDate() });
                });
                records.sort((a, b) => b.timestamp - a.timestamp);
                if (records.length === 0) {
                     noRecordsRow.classList.remove('hidden');
                     attendanceTableBody.appendChild(noRecordsRow);
                } else {
                    records.forEach(record => {
                        const row = document.createElement('tr');
                        row.innerHTML = `<td class="px-6 py-4 whitespace-nowrap"><div class="text-sm font-medium text-gray-900">${record.name}</div></td><td class="px-6 py-4 whitespace-nowrap"><div class="text-sm text-gray-500">${record.timestamp.toLocaleString('es-MX')}</div></td>`;
                        attendanceTableBody.appendChild(row);
                    });
                }
            } catch (error) {
                console.error("Error fetching attendance: ", error);
                const row = document.createElement('tr');
                row.innerHTML = `<td colspan="2" class="px-6 py-12 text-center text-red-600">Error al cargar los registros.</td>`;
                attendanceTableBody.appendChild(row);
            }
        }
        
        async function exportData() {
            const selectedMonth = parseInt(monthSelect.value);
            const year = new Date().getFullYear();
            const startDate = new Date(year, selectedMonth, 1);
            const endDate = new Date(year, selectedMonth + 1, 1);
            try {
                const attendanceCollection = collection(db, 'attendance');
                const q = query(attendanceCollection, where("timestamp", ">=", startDate), where("timestamp", "<", endDate));
                const querySnapshot = await getDocs(q);
                if (querySnapshot.empty) {
                    showMessage('No hay registros para exportar en el mes seleccionado.', 'error');
                    return;
                }
                const dataToExport = querySnapshot.docs.map(doc => { const data = doc.data(); return { "Nombre del Alumno": data.name, "Fecha y Hora": data.timestamp.toDate().toLocaleString('es-MX'), }; });
                dataToExport.sort((a, b) => { if (a["Nombre del Alumno"] < b["Nombre del Alumno"]) return -1; if (a["Nombre del Alumno"] > b["Nombre del Alumno"]) return 1; return new Date(a["Fecha y Hora"]) - new Date(b["Fecha y Hora"]); });
                const worksheet = XLSX.utils.json_to_sheet(dataToExport);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Asistencias");
                const max_width = dataToExport.reduce((w, r) => Math.max(w, r["Nombre del Alumno"].length), 10);
                worksheet["!cols"] = [ { wch: max_width }, { wch: 20 } ];
                const monthName = monthSelect.options[monthSelect.selectedIndex].text.replace(' ', '_');
                XLSX.writeFile(workbook, `Reporte_Asistencia_${monthName}.xlsx`);
            } catch (error) {
                console.error("Error al exportar a Excel:", error);
                showMessage("Ocurrió un error al generar el archivo de Excel.", 'error');
            }
        }

        function showAdminPanel() {
            studentView.classList.add('hidden');
            adminView.classList.remove('hidden');
            toggleViewButton.textContent = 'Volver al Registro';
            headerTitle.textContent = 'Panel de Administrador';
            headerSubtitle.textContent = 'Ver y exportar registros de asistencia.';
            if (monthSelect.options.length === 0) {
                populateMonthSelector();
            }
            fetchAndDisplayAttendance(parseInt(monthSelect.value) || new Date().getMonth());
        }
        
        toggleViewButton.addEventListener('click', () => {
            if (adminView.classList.contains('hidden')) {
                passwordModal.classList.remove('hidden');
                passwordInput.focus();
            } else {
                adminView.classList.add('hidden');
                studentView.classList.remove('hidden');
                toggleViewButton.textContent = 'Ver Panel de Administrador';
                headerTitle.textContent = 'Registro de Asistencia';
                headerSubtitle.textContent = 'Ingresa tu nombre para registrar tu asistencia.';
            }
        });

        monthSelect.addEventListener('change', () => { fetchAndDisplayAttendance(parseInt(monthSelect.value)); });
        exportButton.addEventListener('click', exportData);
        
        // --- Lógica del Modal de Contraseña ---
        function closePasswordModal() {
            passwordModal.classList.add('hidden');
            passwordInput.value = '';
            passwordError.classList.add('hidden');
        }
        
        passwordForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (passwordInput.value === ADMIN_PASSWORD) {
                closePasswordModal();
                showAdminPanel();
            } else {
                passwordError.classList.remove('hidden');
                passwordInput.value = '';
            }
        });

        cancelPasswordButton.addEventListener('click', closePasswordModal);
        passwordModal.addEventListener('click', (e) => {
            if (e.target === passwordModal) {
                closePasswordModal();
            }
        });
        
    </script>
</body>

</html>
